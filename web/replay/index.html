<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Créez une capture d’écran et rejouez les étapes d’un bug depuis un seul JPEG.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ghostframe Replay · Residual Labs</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="codec.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Residual Labs</span></div>
    <span class="local"><span aria-hidden="true"></span>Traitement local</span>
  </header>
  <main>
    <div class="heading">
      <div>
        <h1>Ghostframe Replay<span>.</span></h1>
        <p>Un JPEG pour montrer où cliquer et dans quel ordre.</p>
      </div>
      <div class="tabs" role="group" aria-label="Mode de travail">
        <button id="editor-tab" type="button" aria-pressed="true">Créer</button>
        <button id="reader-tab" type="button" aria-pressed="false">Rejouer</button>
      </div>
    </div>

    <div class="workspace">
      <section class="preview panel" aria-label="Capture">
        <div class="toolbar">
          <div class="file-name" id="file-name">Exemple d’import</div>
          <div class="toolbar-buttons">
            <button type="button" id="example" class="quiet">Exemple</button>
            <button type="button" id="choose" class="quiet">Importer une capture</button>
            <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpeg,.jpg,.webp" hidden>
          </div>
        </div>
        <div id="viewport" class="viewport">
          <div id="stage" class="stage">
            <canvas id="screen" role="img" aria-label="Capture à annoter" tabindex="0" aria-describedby="capture-help">Aperçu de la capture.</canvas>
            <span id="target" class="target" hidden aria-hidden="true"></span>
          </div>
          <div id="empty" class="empty" hidden>
            <p>Ouvrez ou déposez un JPEG exporté depuis Ghostframe.</p>
            <button type="button" id="empty-open" class="primary">Ouvrir un JPEG</button>
          </div>
        </div>
        <div class="transport">
          <div class="transport-buttons">
            <button type="button" id="prev" class="icon" aria-label="Étape précédente">‹</button>
            <button type="button" id="play" class="play">Lire la séquence</button>
            <button type="button" id="next" class="icon" aria-label="Étape suivante">›</button>
          </div>
          <div id="capture-help" class="capture-help"></div>
          <p id="play-caption" class="play-caption" hidden></p>
        </div>
      </section>

      <section class="steps panel" aria-labelledby="steps-heading">
        <div class="steps-header">
          <h2 id="steps-heading">Étapes</h2>
          <span id="step-count" class="counter">0</span>
        </div>
        <p id="no-steps" class="no-steps" hidden>Placez le premier repère sur la capture.</p>
        <ol id="step-list" class="step-list"></ol>
        <div id="edit-step" class="edit-step" hidden>
          <label for="note">Annotation</label>
          <input id="note" maxlength="96" placeholder="Ex. Le bouton reste grisé">
          <label for="duration">Durée d’affichage</label>
          <div class="duration-control"><input id="duration" type="number" inputmode="decimal" min="0.1" max="10" step="0.1"><span>s</span></div>
          <button type="button" id="remove" class="quiet remove">Supprimer cette étape</button>
        </div>
        <div id="export-area" class="export-area">
          <button id="export" type="button" class="primary">Exporter le JPEG</button>
          <div id="capacity" class="capacity"></div>
        </div>
        <div id="copy-area" class="copy-area" hidden>
          <button id="copy-steps" type="button" class="quiet">Copier les étapes</button>
          <textarea id="steps-text" aria-label="Étapes en texte brut" readonly rows="4" hidden></textarea>
        </div>
      </section>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <noscript>Activez JavaScript dans votre navigateur pour créer ou rejouer une capture.</noscript>
  </main>
</body>
</html>
