name: Ghostframe packages

on:
  pull_request:
    paths:
      - '.github/workflows/publish-packages.yml'
      - 'package.json'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'ghostframe.py'
      - 'requirements.txt'
      - 'web/replay/**'
      - 'docs/python-package.md'
  push:
    branches:
      - 'release/pypi-v0.1.1'
    tags:
      - 'npm-v*'
      - 'pypi-v*'

permissions:
  contents: read

jobs:
  npm-build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/npm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check npm tag version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "npm-v$version"
      - run: npm test
      - run: mkdir dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm-stage:
    if: startsWith(github.ref, 'refs/tags/npm-v')
    needs: npm-build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm stage publish ./dist/*.tgz --access public

  python-build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/pypi-v') || github.ref == 'refs/heads/release/pypi-v0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python release version
        if: github.event_name == 'push'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#release/}" = "pypi-v$version"
      - run: python -m pip install build twine -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/pypi-v') || github.ref == 'refs/heads/release/pypi-v0.1.1'
    needs: python-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
