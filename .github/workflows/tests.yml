name: Ghostframe

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python lab.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ghostframe-lab
          path: run/

  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-phase2.txt
      - run: python -m unittest discover -s tests -v
      - run: python platform_lab.py --verify --github-raw
      - run: python audit_pair.py run/phase2/inputs/apng.png run/phase2/processed/reference.png run/phase2/receipt-reference.json > run/phase2/paired-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ghostframe-phase2
          path: run/phase2/
      - run: python profile_fixtures.py
      - run: python profile_weight_pair.py run/phase3-suite/IG01_statique_IDAT_320.png
      - run: python profile_lab.py --verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ghostframe-phase3
          path: |
            run/phase3-suite/
            run/phase3-weight-pair/
            run/phase3-profiles/
